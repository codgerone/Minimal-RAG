<header><h1>Minimal RAG V3.0 · 接口与插件架构审核图</h1><p>架构已完成规格级编码就绪复审；本图是可交互摘要，字段级权威仍在<a href="spec/architecture/assembly-contracts.md">装配契约</a>及其链接的子契约。按住画布拖动平移；悬停接口看可用插件，悬停两侧圆点看数据契约。主图只展示关键处理接口；PDF 证据与存储端口等支撑依赖保留在正式契约中。</p><div class="legend"><span><i class="sample"></i>必接 one</span><span><i class="sample opt"></i>选接 multi</span><span><i class="sample cond"></i>条件必接 one</span><span><i class="stroke"></i>数据依赖</span><span><i class="stroke cond"></i>条件数据依赖</span></div></header>

// 处理器内部仅从装配契约的有向边绘制；每条箭头的终点是真实消费者。
const processorEdges=[
 ['source','main','','主解析'],
 ['source','extract','','局部提取'],
 ['main','selector','C1','主解析定位'],
 ['extract','selector','C1','候选报告'],
 ['extract','tableprep','C1+C2','候选结构查找'],
 ['main','composer','','主文档'],
 ['selector','composer','C1','采用结论'],
 ['main','header','C2','原生表结构'],
 ['selector','header','C1+C2','采用结构'],
 ['header','serializer','C2',''],
 ['serializer','tableprep-end','C2',''],
 ['tableprep','composer','C2','表格文本'],
 ['composer','assembly-final','','']
];
function drawProcessor(){const g=document.getElementById('processor-graph');if(!g)return;let svg=g.querySelector('svg');if(!svg){svg=document.createElementNS('http://www.w3.org/2000/svg','svg');g.prepend(svg)}const gr=g.getBoundingClientRect();svg.setAttribute('width',g.clientWidth);svg.setAttribute('height',g.clientHeight);svg.setAttribute('viewBox',`0 0 ${g.clientWidth} ${g.clientHeight}`);svg.innerHTML='<defs><marker id="tip-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2465c5"/></marker><marker id="tip-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7846ac"/></marker></defs>';
const center=(selector,side)=>{const node=g.querySelector(selector);if(!node)return null;const port=node.querySelector(':scope > .ports > .port.'+side);const r=(port||node).getBoundingClientRect();return{x:(side==='out'?r.right:r.left)-gr.left,y:r.top+r.height/2-gr.top}};
const xy=(id,side)=>{if(id==='source'){const r=g.querySelector('.origin').getBoundingClientRect();return{x:r.right-gr.left,y:r.top+r.height/2-gr.top}}if(id==='assembly-final'||id==='tableprep-end'){const sel=id==='assembly-final'?'.assembler':'.tableprep';const r=g.querySelector(sel+' > .ports > .port.out').getBoundingClientRect();return{x:r.left-gr.left,y:r.top+r.height/2-gr.top}}return center('.processor-graph [data-key="'+id+'"]',side)};
for(const [from,to,condition,label] of processorEdges){let a=xy(from,'out'),b=xy(to,'in');if(!a||!b)continue;let mid=a.x+(b.x-a.x)*.52;let path,labelY=Math.min(a.y,b.y)-8;if(from==='source'){const bend=a.x+13;path=`M${a.x},${a.y} H${bend} V${b.y} H${b.x-6}`}else if(from==='main'&&to==='composer'){const rail=110;path=`M${a.x},${a.y} H${a.x+75} V${rail} H${b.x-17} V${b.y} H${b.x-6}`;labelY=rail-8}else if(from==='selector'&&to==='composer'){const rail=g.clientHeight-15;path=`M${a.x},${a.y} H${a.x+65} V${rail} H${b.x-17} V${b.y} H${b.x-6}`;labelY=rail-8}else if(from==='main'&&to==='header'){const bend=a.x+85;path=`M${a.x},${a.y} H${bend} V${b.y} H${b.x-6}`}else if(from==='selector'&&to==='header'){const bend=a.x+85;path=`M${a.x},${a.y} H${bend} V${b.y} H${b.x-6}`}else if(from==='header'&&to==='serializer'){const bend=a.x+15;path=`M${a.x},${a.y} H${bend} V${b.y} H${b.x-6}`}else{path=`M${a.x},${a.y} H${mid} V${b.y} H${b.x-6}`}
const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',path);p.setAttribute('fill','none');p.setAttribute('stroke',condition?'#7846ac':'#2465c5');p.setAttribute('stroke-width','2');if(condition)p.setAttribute('stroke-dasharray','6 4');p.setAttribute('marker-end',condition?'url(#tip-violet)':'url(#tip-blue)');p.dataset.edge=from+'>'+to;svg.appendChild(p);
if(label){const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',String((a.x+b.x)/2));t.setAttribute('y',String(labelY));t.setAttribute('text-anchor','middle');t.setAttribute('class','flow-label'+(condition?' cond':''));t.textContent=(condition?'['+condition+'] ':'')+label;svg.appendChild(t)}}
}
requestAnimationFrame(drawProcessor);addEventListener('resize',drawProcessor);
// Indexer 主路与必需快照派生支路分开画。紫色虚线表示派生输入和发布前置，不表示选接。
function drawIndexer(){
  const box=document.querySelector('.ingest-assembly'),branch=box?.querySelector(':scope > .artifact-branch'),artifact=branch?.querySelector('.artifact');if(!box||!artifact)return;
 const chunker=box.querySelector('.indexer-main > .chunker'),processor=box.querySelector('.indexer-main > .processor'),embedder=box.querySelector('.indexer-main > .embedder'),publisher=box.querySelector('.indexer-main > .publisher');
 artifact.style.left=(chunker.getBoundingClientRect().left+chunker.offsetWidth/2-branch.getBoundingClientRect().left-artifact.offsetWidth/2)+'px';
 let svg=box.querySelector(':scope > svg.indexer-edges');if(!svg){svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('indexer-edges');box.prepend(svg)}
 const b=box.getBoundingClientRect(),p=(el,side)=>{const r=el.getBoundingClientRect();return{x:(side==='left'?r.left:side==='right'?r.right:r.left+r.width/2)-b.left,y:(side==='top'?r.top:side==='bottom'?r.bottom:r.top+r.height/2)-b.top}};
 svg.setAttribute('width',box.clientWidth);svg.setAttribute('height',box.clientHeight);svg.setAttribute('viewBox',`0 0 ${box.clientWidth} ${box.clientHeight}`);
 svg.innerHTML='<defs><marker id="index-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7846ac"/></marker></defs>';
 const line=(d,label,x,y)=>{const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('fill','none');path.setAttribute('stroke','#7846ac');path.setAttribute('stroke-width','2');path.setAttribute('stroke-dasharray','6 4');path.setAttribute('marker-end','url(#index-tip)');svg.appendChild(path);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor','middle');t.setAttribute('class','flow-label cond');t.textContent=label;svg.appendChild(t)};
 const ap=p(artifact,'top'),al=p(artifact,'left'),ar=p(artifact,'right'),pb=p(processor,'bottom'),cb=p(chunker,'bottom'),eb=p(embedder,'bottom'),pub=p(publisher,'bottom');
 line(`M${pb.x},${pb.y} V${al.y-17} H${al.x-7} V${al.y} H${al.x-2}`,'已完成解析 / 组装事实',Math.round((pb.x+al.x)/2),al.y-22);
 line(`M${cb.x},${cb.y} V${ap.y-5}`,'ChunkBatch',cb.x+67,Math.round((cb.y+ap.y)/2));
 line(`M${ar.x},${ar.y} H${eb.x} V${eb.y+4}`,'快照暂存成功门',Math.round((ar.x+eb.x)/2),ar.y-9);
 const rail=Math.max(ar.y,pub.y)+70;line(`M${ar.x},${ar.y+5} V${rail} H${pub.x} V${pub.y+4}`,'StagedArtifacts',Math.round((ar.x+pub.x)/2),rail-8);
}
requestAnimationFrame(drawIndexer);addEventListener('resize',drawIndexer);
const view=document.querySelector('.viewport');let drag=null;view.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button,a'))return;drag={x:e.clientX,y:e.clientY,left:view.scrollLeft,top:view.scrollTop};view.classList.add('dragging');view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(!drag)return;view.scrollLeft=drag.left-(e.clientX-drag.x);view.scrollTop=drag.top-(e.clientY-drag.y)});for(const event of ['pointerup','pointercancel'])view.addEventListener(event,()=>{drag=null;view.classList.remove('dragging')});
</script></body></html>
