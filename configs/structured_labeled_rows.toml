name = "structured_labeled_rows"
description = "同 structured，表格文本改为带列名的 Markdown 竖线行（labeled_rows_v1）"

[parser]
use = "docling_layout"

[[table_extractors]]
use = "pymupdf"

[[table_extractors]]
use = "camelot"

[[table_extractors]]
use = "docling"

[[table_extractors]]
use = "unstructured"

[table_formatter]
use = "labeled_rows_v1"

[chunker]
use = "structured_tokens"
max_tokens = 512
overlap_tokens = 32

[embedder]
use = "e5_small"

[retriever]
use = "semantic"
top_k = 4          # search / ask / chat 返回的条数
document_filter = true   # 问题中出现 documents/documents.toml 登记的标识编码时，只在对应文档内检索

[eval]
top_k = 3          # 正式评估的 K，保持与历史基线可比

[llm]
use = "openrouter"
model = "google/gemini-2.5-flash-lite"
