name = "plain_text_bm25"
description = "V3.9 实验：纯 BM25（去停用词）；其余同 plain_text"

[parser]
use = "pymupdf_pages"

[chunker]
use = "characters"
chunk_size = 300
chunk_overlap = 50

[embedder]
use = "bge_m3"

[lexical]
stopwords = true
stemming = false

[retriever]
use = "bm25"
top_k = 4          # search / ask / chat 返回的条数
document_filter = true   # 问题中出现 documents/documents.toml 登记的标识编码时，只在对应文档内检索

[eval]
top_k = 3          # 正式评估的 K，保持与历史基线可比

[llm]
use = "openrouter"
model = "google/gemini-2.5-flash-lite"
