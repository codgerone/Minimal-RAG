[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minimal-rag"
version = "0.1.0"
description = "A minimal but complete local PDF RAG system."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "camelot-py>=1.0,<3",
    "chromadb>=1.0,<2",
    "docling>=2,<3",
    "langchain-text-splitters>=0.3,<2",
    "openai>=1.0,<3",
    "pymupdf>=1.24,<2",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=3.0,<6",
    "unstructured[local-inference]>=0.18,<1",
    "unstructured-inference>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
addopts = "-m \"not live\""
testpaths = ["tests"]
markers = [
    "live: requires network access and a real OpenRouter API key",
]
